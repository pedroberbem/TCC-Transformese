<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="container-formulario">

        <div class="lamp-wrapper">
            <div class="lamp-cord"></div>
            <div class="lamp-shade"></div>
            <div class="lamp-glow"></div>
            <div class="lamp-cone"></div>
        </div>


        <section class="container-contato">
            <h2 class="formulario-titulo">Solicitar Orçamento</h2>
            <p class="formulario-subtitulo">Preencher os campos abaixo e entraremos em contato</p>

            <form action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="bb0d2807-3f85-4d67-b109-12ff6352b318">
                <div class="grupo-formulario">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
                </div>

                <div class="grupo-formulario">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="Digite seu email">
                </div>

                <div class="grupo-formulario">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" required placeholder="Digite seu telefone com DDD">
                </div>

                <div class="grupo-formulario">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" placeholder="Descreva o serviço que você precisa"></textarea>
                </div>

                <button type="submit" class="btn-form">SOLICITAR ORÇAMENTO</button>
            </form>

        </section>
    </section>
    <script src="formulario.js"></script>
</body>

</html>
